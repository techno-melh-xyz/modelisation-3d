# Publication complete du site SolidCraft sur GitHub Pages.
#
# Ce workflow reconstruit :
# - la documentation mdBook et ses illustrations ;
# - l'application web Rust / WebAssembly ;
# - les fichiers du depot Flatpak.
#
# Les modifications de docs/book/ sont gerees separement
# par le workflow rapide mdbook.yml.
#
# Configuration requise :
# Settings > Pages > Source = GitHub Actions

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/solidcraft-web/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/**"
      - "packaging/flatpak-site.sh"
      - ".github/workflows/pages.yml"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release for Flatpak (empty: latest stable release)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Evite deux publications simultanees.
# Ce groupe doit aussi etre utilise dans mdbook.yml.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: v0.5.4
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Rust et WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Installer mdBook et Trunk
        run: |
          mkdir -p "$HOME/.local/bin"

          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"

          curl -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Installer le pilote Vulkan logiciel
        # Necessaire pour generer les images du manuel.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            --no-install-recommends \
            mesa-vulkan-drivers libvulkan1

      - name: Construire la documentation complete
        env:
          SOLIDCRAFT_GPU: software
        run: cargo xtask book

      - name: Compiler l'application SolidCraft Web
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url ./

      - name: Conserver l'application web compilee
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-web-dist
          path: dist/web/
          retention-days: 30
          if-no-files-found: error
    
       - name: Test de fonctionnement hors ligne
         continue-on-error: true
         run: cargo xtask web-offline-test --site dist/web

      - name: Assembler le site complet
        run: |
          echo "=== Documentation mdBook ==="
          mkdir -p site
          cp -a target/book/. site/

          echo "=== Preparation SEO ==="
          bash docs/book/seo.sh site

          echo "=== Application SolidCraft ==="
          cp -a dist/web site/app

          echo "=== Verification initiale ==="
          test -f site/index.html
          test -f site/app/index.html

          echo "=== Taille du site ==="
          du -sh site/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        id: pages

      - name: Installer les outils Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            --no-install-recommends \
            flatpak ostree

      - name: Integrer le depot Flatpak publie
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: bash packaging/flatpak-site.sh site

      - name: Verifier le site avant publication
        run: |
          echo "=== Documentation ==="
          test -f site/index.html
          echo "OK : documentation presente"

          echo "=== Application ==="
          test -f site/app/index.html
          echo "OK : application presente"

          echo "=== WebAssembly ==="
          WASM=$(find site/app -type f \
            -name "*.wasm" -print -quit)

          if [ -z "$WASM" ]; then
            echo "ERREUR : fichier WebAssembly absent"
            exit 1
          fi

          echo "OK : $WASM"

          echo "=== Taille totale ==="
          du -sh site/

      - name: Preparer l'archive GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
